name: Linux host (ROM-free)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev
      - name: Shell syntax
        run: bash -n tools/build-linux.sh run-steamdeck.sh
      - name: Compile generator, SDL frontend and runtime; test portable host
        run: bash tools/build-linux.sh --check
      # No ROM downloads, generated game code, saves or game binary artifacts.
